name: desktop-build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        working-directory: apps/desktop-ui
        run: npm ci

      - name: 安装 Tauri Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 构建桌面包
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop-ui
          tauriScript: npm run tauri
          args: --bundles deb,appimage
          includeDebug: false

      - name: 列出打包产物
        run: |
          find target/release/bundle -maxdepth 3 -type f | sort || true

      - name: 上传 Linux 安装包到 Actions
        uses: actions/upload-artifact@v4
        with:
          name: traffic-cat-linux-bundles
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          artifacts=(
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          )

          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "未找到可发布的 Linux 安装包" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${artifacts[@]}" \
              --title "traffic-cat $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
